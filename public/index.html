<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI bán 10 cân hẹ</title>
  <link rel="icon" type="image/x-icon" href="https://clickwo.com/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <!-- Import mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
  </script>

  <style>
    body {
      background: #f4f4f4;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .chat-container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
      width: 100vw;
      height: 100vh;
      margin: 0 auto;
      max-width: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #007bff;
      color: #fff;
      padding: 16px;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .session-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .session-selector {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
      font-size: 14px;
      min-width: 150px;
    }

    .session-selector option {
      background: #007bff;
      color: white;
    }

    .session-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      color: white;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .session-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .current-session {
      font-size: 12px;
      opacity: 0.9;
      margin-top: 5px;
    }

    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: none;
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      margin-bottom: 8px;
    }

    .chat-message.user {
      align-self: flex-end;
      background: #e6f0ff;
      border-radius: 12px 12px 0 12px;
      padding: 10px;
    }

    .chat-message.ai {
      align-self: flex-start;
      background: #f1f1f1;
      border-radius: 12px 12px 12px 0;
      padding: 10px;
    }

    .chat-message img {
      max-width: 180px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .chat-message .mermaid {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 8px;
      border-radius: 6px;
      margin-top: 8px;
      overflow-x: auto;
      max-width: 100%;
      white-space: pre-wrap;
    }

    .chat-form {
      display: flex;
      align-items: center;
      padding: 12px;
      border-top: 1px solid #eee;
      gap: 8px;
      background: #fafbfc;
    }

    .chat-form textarea {
      flex: 1;
      resize: none;
      border-radius: 6px;
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 15px;
    }

    .chat-form button {
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-form button:hover {
      background: #0056b3;
    }

    .file-label {
      cursor: pointer;
      font-size: 20px;
      margin-right: 4px;
      color: #007bff;
      user-select: none;
    }

    #file-preview {
      transition: all 0.3s ease;
    }

    #file-preview:hover {
      background: #bbdefb !important;
    }

    .file-info {
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.2;
    }

    .file-display {
      margin-top: 8px;
      background: #e3f2fd;
      border: 1px solid #bbdefb;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 300px;
      transition: all 0.2s ease;
    }

    .file-display:hover {
      background: #bbdefb;
    }

    .session-name-input {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
      font-size: 14px;
      width: 200px;
    }

    .session-name-input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close {
      color: #aaa;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: #000;
    }

    .modal-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .modal-btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 10px;
    }

    .modal-btn:hover {
      background: #0056b3;
    }

    .modal-btn.secondary {
      background: #6c757d;
    }

    .modal-btn.secondary:hover {
      background: #545b62;
    }

    @media (max-width: 768px) {
      .chat-header {
        flex-direction: column;
        text-align: center;
      }

      .session-controls {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="Menu"><a href="main.html" style="color: white; text-decoration: none;">
        <i class="fa-solid fa-house"></i> Trang chủ</a></div>
        <div class="session-controls">
          <button type="button" id="goto" class="session-btn" onclick="location.href='./n8n.html'">
          Đi tới n8n.html
        </button>
      </div>
      <div>
        <h2>AI Chatbot, Hỗ trợ tạo n8n</h2>
        <div class="current-session"><span id="currentSessionDisplay">Loading...</span></div>
      </div>

      <div class="session-controls">
        <select id="sessionSelector" class="session-selector">
          <option value="">Chọn session...</option>
        </select>
        <button id="newSessionBtn" class="session-btn">
          <i class="fa-solid fa-plus"></i> Tạo mới
        </button>
        <button id="renameSessionBtn" class="session-btn">
          <i class="fa-solid fa-edit"></i> Đổi tên
        </button>
        <button id="deleteSessionBtn" class="session-btn">
          <i class="fa-solid fa-trash"></i> Xóa
        </button>
        <button type="button" id="goto" class="session-btn" onclick="location.href='./n8n.html'">
          Đi tới n8n.html
        </button>
      </div>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <form id="chatForm" class="chat-form">
      <textarea name="prompt" id="prompt" placeholder="Nhập tin nhắn..." rows="2" required></textarea>
      <label class="file-label">
        <input type="file" name="image" id="imageInput" accept="image/*, .pdf, .docx, .xlsx" style="display:none">
        <span><i class="fa-solid fa-folder-open"></i></span>
      </label>
      <button type="submit">Gửi</button>
    </form>
  </div>

  <!-- Khung tạo session mới -->
  <div id="newSessionModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Tạo Đoạn Chat Mới</h3>
        <span class="close" data-modal="newSessionModal">&times;</span>
      </div>
      <input type="text" id="newSessionName" class="modal-input" placeholder="Nhập tên đoạn chat">
      <button id="confirmNewSession" class="modal-btn">Tạo</button>
      <button class="modal-btn secondary" data-modal="newSessionModal">Hủy</button>
    </div>
  </div>

  <!-- Khung đổi tên session -->
  <div id="renameSessionModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Đổi Tên Đoạn Chat</h3>
        <span class="close" data-modal="renameSessionModal">&times;</span>
      </div>
      <input type="text" id="renameSessionName" class="modal-input" placeholder="Nhập tên mới">
      <button id="confirmRename" class="modal-btn">Lưu</button>
      <button class="modal-btn secondary" data-modal="renameSessionModal">Hủy</button>
    </div>
  </div>
  <script src="./chat.js" defer></script>
